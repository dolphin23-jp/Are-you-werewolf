[project]
name = "werewolf-backend"
version = "0.1.0"
description = "Are you werewolf - AI werewolf game backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "openai>=1.50.0",
    "websockets>=13.0",
    # Role deduction (app/ai/reasoning/solver). The 17-player composition with
    # per-seat private knowledge is a constraint problem, and an SMT solver
    # answers "possible / forced / implied" exactly, where hand-rolled
    # enumeration would be both slower and easy to get subtly wrong.
    "z3-solver>=4.13,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
rl = [
    # Lightweight Phase-1 learning baseline. The final large policy can replace
    # this implementation without changing the environment/action protocol.
    "numpy>=2.5,<3",
]
transformer = [
    # Kept separate from the lightweight RL extra so normal backend CI and
    # environments do not download the large PyTorch distribution.
    "torch>=2.13,<2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_llm: requires a real LLM endpoint, skipped by default",
]
addopts = "-m 'not live_llm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "app.engine.*"
strict = true

[[tool.mypy.overrides]]
# The v2 evaluator normalizes several heterogeneous Pydantic sections in one
# scoring function. Their containers stay explicitly typed; permit only local
# loop-variable rebinding in this module, without disabling any error codes.
module = "app.eval.expert_scenarios_v2"
allow_redefinition = true

[[tool.mypy.overrides]]
# z3-solver ships no type information; the encoding is isolated in
# app/ai/reasoning/solver/z3_backend.py, which converts at its own boundary.
module = "z3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyTorch is an optional heavyweight dependency. The dedicated transformer CI
# job installs it and type-checks the transformer modules with the real package;
# lightweight backend environments may omit it entirely.
module = ["torch", "torch.*"]
ignore_missing_imports = true

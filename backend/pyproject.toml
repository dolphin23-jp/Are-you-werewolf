[project]
name = "werewolf-backend"
version = "0.1.0"
description = "Are you werewolf - AI werewolf game backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "openai>=1.50.0",
    "websockets>=13.0",
    # Role deduction (app/ai/reasoning/solver). The 17-player composition with
    # per-seat private knowledge is a constraint problem, and an SMT solver
    # answers "possible / forced / implied" exactly, where hand-rolled
    # enumeration would be both slower and easy to get subtly wrong.
    "z3-solver>=4.13,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_llm: requires a real LLM endpoint, skipped by default",
]
addopts = "-m 'not live_llm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "app.engine.*"
strict = true

[[tool.mypy.overrides]]
# z3-solver ships no type information; the encoding is isolated in
# app/ai/reasoning/solver/z3_backend.py, which converts at its own boundary.
module = "z3.*"
ignore_missing_imports = true

name: AI評価

# Manual only. This spends real API credit, so it must never fire on push.
on:
  workflow_dispatch:
    inputs:
      games:
        description: "対戦数(1戦あたり約280回のAPI呼び出し)"
        required: true
        default: "1"
      seed:
        description: "シード(同じ値なら配役・人格が再現され、変更前後を比較できます)"
        required: true
        default: "1"
      judge:
        description: "日本語・人格をLLMで採点する(追加費用)"
        type: boolean
        default: false
      price_in:
        description: "入力100万トークンあたりの単価(0なら金額換算しない)"
        required: false
        default: "0"
      price_out:
        description: "出力100万トークンあたりの単価"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # A real 17-player game makes roughly 250 model calls. PR #7 deliberately
    # deepened the discussion flow, so a single game can legitimately take
    # longer than one hour even though the endpoint is healthy. Keep a finite
    # ceiling to prevent runaway spend, but do not cancel a normal evaluation
    # immediately before it can write report.md.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係のインストール
        run: pip install -e "./backend[dev]"

      - name: 接続確認(1回の呼び出し)
        working-directory: backend
        env:
          WEREWOLF_LLM_PROVIDER: luna
          LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
          LUNA_BASE_URL: ${{ secrets.LUNA_BASE_URL }}
          LUNA_MODEL: ${{ vars.LUNA_MODEL || 'gpt-5.6-luna' }}
        run: python scripts/check_llm.py

      - name: 評価の実行
        working-directory: backend
        env:
          WEREWOLF_LLM_PROVIDER: luna
          LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
          LUNA_BASE_URL: ${{ secrets.LUNA_BASE_URL }}
          LUNA_MODEL: ${{ vars.LUNA_MODEL || 'gpt-5.6-luna' }}
          # Inputs reach the shell as variables, never as interpolated script
          # text, so a crafted value cannot run commands next to the API key.
          GAMES: ${{ inputs.games }}
          SEED: ${{ inputs.seed }}
          JUDGE: ${{ inputs.judge }}
          PRICE_IN: ${{ inputs.price_in }}
          PRICE_OUT: ${{ inputs.price_out }}
        run: |
          # Each game is a few hundred paid calls; a typo like 100 should not
          # be a three-hour bill.
          if ! [[ "$GAMES" =~ ^[0-9]+$ ]] || (( GAMES < 1 || GAMES > 10 )); then
            echo "games must be between 1 and 10 (got: $GAMES)" >&2
            exit 1
          fi
          extra=()
          if [ "$JUDGE" = "true" ]; then
            extra+=(--judge)
          fi
          python scripts/evaluate.py \
            --games "$GAMES" \
            --seed "$SEED" \
            --provider luna \
            --price-in "$PRICE_IN" \
            --price-out "$PRICE_OUT" \
            --out eval-out \
            "${extra[@]}"

      # Renders the report directly on the run page, so it is readable on a
      # phone without downloading the artifact.
      - name: レポートを画面に表示
        if: always()
        working-directory: backend
        run: |
          if [ -f eval-out/report.md ]; then
            cat eval-out/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "レポートが生成されませんでした。上のログを確認してください。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 対戦記録も表示(先頭のみ)
        if: always()
        working-directory: backend
        run: |
          transcript=$(ls eval-out/transcript-seed*.md 2>/dev/null | head -1)
          if [ -n "$transcript" ]; then
            {
              echo ""
              echo "<details><summary>対戦記録(クリックで展開)</summary>"
              echo ""
              # Keep well under the 1MB step-summary limit; the full log is
              # in the downloadable artifact.
              head -c 400000 "$transcript"
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 全出力をダウンロード可能にする
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-out
          path: backend/eval-out/
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Every check below runs even when an earlier one fails. Default fail-fast
      # let a one-line lint error hide the entire test signal for four consecutive
      # merges; the job still fails, but now the report says what else is broken.
      - name: Install dependencies
        id: install
        run: pip install -e ".[dev,rl]"
      - name: Lint (ruff)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check app tests scripts
      - name: Type check (mypy)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Torch is intentionally absent from this lightweight environment. The
        # dedicated job below installs the real package and checks these modules.
        run: mypy app --exclude '^app/training/torch_.*\.py$'
      - name: Test (pytest, mock provider only -- zero API cost)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest

  # Keep the heavyweight neural dependency out of the normal backend job.
  # Installing the CPU wheel explicitly also avoids pulling CUDA packages on
  # GitHub-hosted runners. Transformer tests are isolated and zero-API-cost.
  backend-transformer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and transformer dependencies
        id: install
        run: |
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,rl,transformer]"
      - name: Lint transformer code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check app/training/torch_*.py tests/training/test_torch_*.py
      - name: Type check transformer code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy app/training/torch_*.py
      - name: Test transformer code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest tests/training/test_torch_*.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      # Same reasoning as the backend job: never let one failing check mask the rest.
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Lint (eslint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec eslint .
      - name: Type check (tsc)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsc -b --noEmit
      - name: Test (vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vitest run
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run build

  # Exercises the exact path a Codespace takes: build the UI, then serve
  # API + UI + WebSocket from one port via .devcontainer/start.sh.
  single-port-serve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Check devcontainer scripts parse
        run: bash -n .devcontainer/setup.sh && bash -n .devcontainer/start.sh
      - name: Install backend
        run: pip install -e "./backend[dev]"
      - name: Install and build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Serve on a single port and smoke test it
        run: |
          bash .devcontainer/start.sh &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health >/dev/null && break
            sleep 1
          done

          echo "--- /api/health ---"
          curl -sf http://localhost:8000/api/health | tee /tmp/health.json
          grep -q '"frontend_bundled":true' /tmp/health.json

          echo "--- / must serve the SPA shell ---"
          curl -sf http://localhost:8000/ | grep -q '<div id="root"></div>'

          echo "--- unknown /api path must 404, not return HTML ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/nope)
          test "$code" = "404"

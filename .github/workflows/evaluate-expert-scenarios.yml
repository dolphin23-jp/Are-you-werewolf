name: Expert cutoff評価

# Manual only. Luna mode spends API credit; baseline mode is free.
on:
  workflow_dispatch:
    inputs:
      benchmark_version:
        description: "評価器バージョン"
        type: choice
        options:
          - v1
          - v2
        default: v2
      provider:
        description: "評価対象"
        type: choice
        options:
          - baseline
          - luna
        default: baseline
      seed:
        description: "候補順シード(前後比較では同じ値を使用)"
        required: true
        default: "1"
      scenario_id:
        description: "1件だけ実行するscenario_id。空欄なら全件"
        required: false
        default: ""
      price_in:
        description: "入力100万トークンあたり単価"
        required: false
        default: "0"
      price_out:
        description: "出力100万トークンあたり単価"
        required: false
        default: "0"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係のインストール
        run: pip install -e "./backend[dev]"

      - name: 接続確認
        if: inputs.provider == 'luna'
        working-directory: backend
        env:
          WEREWOLF_LLM_PROVIDER: luna
          LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
          LUNA_BASE_URL: ${{ secrets.LUNA_BASE_URL }}
          LUNA_MODEL: ${{ vars.LUNA_MODEL || 'gpt-5.6-luna' }}
        run: python scripts/check_llm.py

      - name: Cutoff評価を実行
        id: benchmark
        working-directory: backend
        env:
          WEREWOLF_LLM_PROVIDER: ${{ inputs.provider == 'luna' && 'luna' || 'mock' }}
          LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
          LUNA_BASE_URL: ${{ secrets.LUNA_BASE_URL }}
          LUNA_MODEL: ${{ vars.LUNA_MODEL || 'gpt-5.6-luna' }}
        run: |
          extra=()
          if [ -n "${{ inputs.scenario_id }}" ]; then
            extra+=(--scenario-id "${{ inputs.scenario_id }}")
          fi
          if [ "${{ inputs.benchmark_version }}" = "v2" ]; then
            script="scripts/evaluate_expert_scenarios_v2.py"
            output_dir="expert-eval-v2-out"
          else
            script="scripts/evaluate_expert_scenarios.py"
            output_dir="expert-eval-out"
          fi
          python "$script" \
            --provider "${{ inputs.provider }}" \
            --seed "${{ inputs.seed }}" \
            --price-in "${{ inputs.price_in }}" \
            --price-out "${{ inputs.price_out }}" \
            --out "$output_dir" \
            "${extra[@]}"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: レポートを画面に表示
        if: always()
        working-directory: backend
        run: |
          output_dir="${{ steps.benchmark.outputs.output_dir }}"
          if [ -z "$output_dir" ]; then
            output_dir="${{ inputs.benchmark_version == 'v2' && 'expert-eval-v2-out' || 'expert-eval-out' }}"
          fi
          if [ -f "$output_dir/report.md" ]; then
            cat "$output_dir/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "レポートが生成されませんでした。上のログを確認してください。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 全出力をダウンロード可能にする
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expert-eval-${{ inputs.benchmark_version }}-out
          path: backend/${{ steps.benchmark.outputs.output_dir }}/
          retention-days: 30
